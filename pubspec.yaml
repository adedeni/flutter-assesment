name: paxform
description: "A medical center technical assessment screen for paxform."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.5 <4.0.0'

#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # State Management
  get: ^4.7.2

  # Product Specific
  carousel_slider: ^5.1.1
  flutter_rating_bar: ^4.0.1
  dropdown_button2: ^2.3.9

#--------------- ./ PACKAGES END ------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/
    - assets/icons/
    - assets/fonts/
    - assets/images/


#--------------- LOCAL FONTS ------------------#
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/PublicSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PublicSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PublicSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PublicSans-Black.ttf
          weight: 900