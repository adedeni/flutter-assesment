name: paxform
description: "A medical center technical assessment screen for paxform."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.5 <4.0.0'

#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # State Management
  get: ^4.7.2

  # Product Specific
  carousel_slider: ^5.1.1
  flutter_rating_bar: ^4.0.1
  dropdown_button2: ^2.3.9

#--------------- ./ PACKAGES END ------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/


#--------------- LOCAL FONTS ------------------#
fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/Poppins-Light.ttf